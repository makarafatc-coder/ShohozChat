<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShohojChat</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 h-screen flex items-center justify-center p-0 md:p-4">

    <!-- লগইন স্ক্রিন -->
    <div id="loginScreen" class="bg-white p-8 rounded-2xl shadow-2xl text-center w-full max-w-sm mx-auto">
        <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-comments text-4xl text-blue-600"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2 text-gray-800">ShohojChat</h1>
        <p class="text-gray-500 mb-8">সহজে কথা বলুন, বন্ধুদের সাথে যুক্ত থাকুন</p>
        <button id="googleLoginBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl w-full hover:bg-blue-700 transition duration-300 flex items-center justify-center gap-3 font-semibold shadow-lg">
            <i class="fa-brands fa-google"></i> Google দিয়ে লগইন করুন
        </button>
        <p class="text-xs text-gray-400 mt-6">লগইন করলে আপনি আমাদের শর্তাবলী মেনে নিচ্ছেন</p>
    </div>

    <!-- চ্যাট স্ক্রিন -->
    <div id="chatScreen" class="hidden bg-white w-full max-w-md h-full md:h-[90vh] flex flex-col rounded-none md:rounded-2xl shadow-2xl overflow-hidden">
        <!-- হেডার -->
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-400 rounded-full flex items-center justify-center font-bold">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg leading-tight">ShohojChat Group</h2>
                    <p class="text-xs text-blue-200" id="onlineStatus">অনলাইন</p>
                </div>
            </div>
            <button id="logoutBtn" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

        <!-- মেসেজ লিস্ট -->
        <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-4 no-scrollbar">
            <!-- মেসেজগুলো এখানে আসবে -->
        </div>

        <!-- মেসেজ ইনপুট -->
        <div class="p-3 border-t bg-white flex gap-2 items-center rounded-b-2xl">
            <button class="text-gray-400 hover:text-blue-500 p-2 text-xl transition"><i class="fa-solid fa-paperclip"></i></button>
            <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." class="flex-1 bg-gray-100 border-0 rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-gray-700">
            <button id="sendBtn" class="bg-blue-600 text-white w-12 h-12 rounded-full hover:bg-blue-700 transition flex items-center justify-center shadow-md">
                <i class="fa-solid fa-paper-plane text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================
        // ১. আপনার Firebase Config এখানে বসান
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDVxS9IYesZFXQP92U_Flux2cAOTxN2rnU",
            authDomain: "shohojchat-53146.firebaseapp.com",
            projectId: "shohojchat - 53146 ",
storageBucket:",
            storageBucket: "shohojchat-53146.firebasestorage.app",
            messagingSenderId: "1033147841261",
            appId: "1:1033147841261:web:0bbd7bbcea219c33926ae4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Elements
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        // ============================================
        // ২. লগইন ও লগআউট
        // ============================================
        googleLoginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert("লগইন এরর: " + error.message));
        });

        logoutBtn.addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged(user => {
            if (user) {
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                loadMessages();
                updateUserProfile(user);
            } else {
                loginScreen.classList.remove('hidden');
                chatScreen.classList.add('hidden');
                messagesContainer.innerHTML = '';
            }
        });

        // ইউজার ডাটাবেজে সেভ করা (প্রোফাইল)
        async function updateUserProfile(user) {
            const userRef = db.collection('users').doc(user.uid);
            const doc = await userRef.get();
            if (!doc.exists) {
                await userRef.set({
                    uid: user.uid,
                    display_name: user.displayName,
                    email: user.email,
                    photo_url: user.photoURL,
                    created_time: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        // ============================================
        // ৩. মেসেজ পাঠানো
        // ============================================
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            const user = auth.currentUser;
            try {
                await db.collection('messages').add({
                    text: text,
                    senderId: user.uid,
                    senderName: user.displayName,
                    senderPhoto: user.photoURL,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                messageInput.value = '';
            } catch (error) {
                alert("মেসেজ পাঠাতে সমস্যা: " + error.message);
            }
        }

        // ============================================
        // ৪. রিয়েল-টাইম মেসেজ লোড করা
        // ============================================
        function loadMessages() {
            db.collection('messages')
              .orderBy('timestamp', 'asc')
              .limit(100)
              .onSnapshot(snapshot => {
                  messagesContainer.innerHTML = '';
                  snapshot.forEach(doc => {
                      const msg = doc.data();
                      const isMe = msg.senderId === auth.currentUser.uid;
                      
                      // টাইম ফরম্যাট করা
                      let timeString = '';
                      if (msg.timestamp) {
                          const date = msg.timestamp.toDate();
                          timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                      }

                      const msgDiv = document.createElement('div');
                      msgDiv.className = `flex gap-2 max-w-[85%] ${isMe ? 'self-end flex-row-reverse' : 'self-start'}`;
                      
                      // ইউজার অ্যাভাটার
                      const avatar = document.createElement('img');
                      avatar.src = msg.senderPhoto || 'https://ui-avatars.com/api/?name=' + msg.senderName;
                      avatar.className = "w-8 h-8 rounded-full object-cover mt-1 shadow-sm";
                      
                      // মেসেজ বাবল
                      const bubble = document.createElement('div');
                      bubble.className = `p-3 rounded-2xl shadow-sm text-sm relative ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 rounded-bl-none border border-gray-100'}`;
                      
                      bubble.innerHTML = `
                          ${!isMe ? `<div class="text-xs font-bold text-blue-600 mb-1">${msg.senderName}</div>` : ''}
                          <div class="leading-relaxed">${msg.text}</div>
                          <div class="text-[10px] text-right mt-1 ${isMe ? 'text-blue-200' : 'text-gray-400'}">${timeString}</div>
                      `;

                      msgDiv.appendChild(avatar);
                      msgDiv.appendChild(bubble);
                      messagesContainer.appendChild(msgDiv);
                  });
                  // অটো স্ক্রল নিচে
                  messagesContainer.scrollTop = messagesContainer.scrollHeight;
              });
        }
    </script>
</body>
</html>
