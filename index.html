<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShohojChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 h-screen flex items-center justify-center p-0 md:p-4">

    <!-- লগইন স্ক্রিন -->
    <div id="loginScreen" class="bg-white p-8 rounded-2xl shadow-2xl text-center w-full max-w-sm mx-auto">
        <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-comments text-4xl text-blue-600"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2 text-gray-800">ShohojChat</h1>
        <p class="text-gray-500 mb-6">সহজে কথা বলুন, বন্ধুদের সাথে যুক্ত থাকুন</p>
        <input type="email" id="emailInput" placeholder="আপনার ইমেইল" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-gray-700">
        <input type="password" id="passwordInput" placeholder="পাসওয়ার্ড" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-gray-700">
        <button id="loginBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl w-full hover:bg-blue-700 transition duration-300 font-semibold shadow-lg mb-3">লগইন করুন</button>
        <button id="signupBtn" class="bg-white text-blue-600 border border-blue-600 px-6 py-3 rounded-xl w-full hover:bg-blue-50 transition duration-300 font-semibold">নতুন অ্যাকাউন্ট খুলুন</button>
        <p id="authMessage" class="text-sm text-red-500 mt-4"></p>
    </div>

    <!-- ইনবক্স (চ্যাট লিস্ট) স্ক্রিন -->
    <div id="inboxScreen" class="hidden bg-white w-full max-w-md h-full md:h-[90vh] flex flex-col rounded-none md:rounded-2xl shadow-2xl overflow-hidden relative">
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <h2 class="font-bold text-xl">ShohojChat</h2>
            <button id="logoutBtn" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
        
        <!-- চ্যাট লিস্ট -->
        <div id="chatList" class="flex-1 overflow-y-auto bg-gray-50 no-scrollbar">
            <!-- চ্যাটগুলো এখানে লোড হবে -->
            <p class="text-center text-gray-400 mt-10">কোনো চ্যাট নেই। নতুন চ্যাট শুরু করুন!</p>
        </div>

        <!-- নতুন চ্যাট বাটন (FAB) -->
        <button id="newChatBtn" class="absolute bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg hover:bg-blue-700 transition flex items-center justify-center text-xl">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- চ্যাট রুম স্ক্রিন -->
    <div id="chatRoomScreen" class="hidden bg-white w-full max-w-md h-full md:h-[90vh] flex flex-col rounded-none md:rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-blue-600 text-white p-4 flex items-center gap-3 shadow-md z-10">
            <button id="backToInboxBtn" class="text-xl hover:text-blue-200"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="w-10 h-10 bg-blue-400 rounded-full flex items-center justify-center font-bold" id="chatPartnerAvatar">?</div>
            <div>
                <h2 class="font-bold text-lg leading-tight" id="chatPartnerName">চ্যাট লোড হচ্ছে...</h2>
                <p class="text-xs text-blue-200">অনলাইন</p>
            </div>
        </div>

        <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-4 no-scrollbar"></div>

        <div class="p-3 border-t bg-white flex gap-2 items-center rounded-b-2xl">
            <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." class="flex-1 bg-gray-100 border-0 rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-gray-700">
            <button id="sendBtn" class="bg-blue-600 text-white w-12 h-12 rounded-full hover:bg-blue-700 transition flex items-center justify-center shadow-md">
                <i class="fa-solid fa-paper-plane text-lg"></i>
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================
        // ১. আপনার Firebase Config এখানে বসান
        // ============================================
        const firebaseConfig = {
  apiKey: "AIzaSyDVxS9IYesZFXQP92U_Flux2cAOTxN2rnU",
  authDomain: "shohojchat-53146.firebaseapp.com",
  projectId: "shohojchat-53146",
  storageBucket: "shohojchat-53146.firebasestorage.app",
  messagingSenderId: "1033147841261",
  appId: "1:1033147841261:web:0bbd7bbcea219c33926ae4",
};

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Elements
        const loginScreen = document.getElementById('loginScreen');
        const inboxScreen = document.getElementById('inboxScreen');
        const chatRoomScreen = document.getElementById('chatRoomScreen');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const authMessage = document.getElementById('authMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatList = document.getElementById('chatList');
        const newChatBtn = document.getElementById('newChatBtn');
        const backToInboxBtn = document.getElementById('backToInboxBtn');
        const chatPartnerName = document.getElementById('chatPartnerName');
        const chatPartnerAvatar = document.getElementById('chatPartnerAvatar');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentUser = null;
        let activeChatId = null;
        let activeChatPartner = null;
        let unsubscribeMessages = null;

        // ============================================
        // ২. লগইন, সাইনআপ ও লগআউট
        // ============================================
        loginBtn.addEventListener('click', () => {
            authMessage.innerText = "লোড হচ্ছে...";
            auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value)
                .catch(error => authMessage.innerText = "ভুল: " + error.message);
        });

        signupBtn.addEventListener('click', () => {
            if(passwordInput.value.length < 6) return authMessage.innerText = "পাসওয়ার্ড কমপক্ষে ৬ ডিজিটের হতে হবে";
            authMessage.innerText = "অ্যাকাউন্ট তৈরি হচ্ছে...";
            auth.createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
                .catch(error => authMessage.innerText = "ভুল: " + error.message);
        });

        logoutBtn.addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                inboxScreen.classList.remove('hidden');
                chatRoomScreen.classList.add('hidden');
                saveUserProfile(user);
                loadChatList();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                inboxScreen.classList.add('hidden');
                chatRoomScreen.classList.add('hidden');
                authMessage.innerText = '';
            }
        });

        async function saveUserProfile(user) {
            const userRef = db.collection('users').doc(user.uid);
            const doc = await userRef.get();
            if (!doc.exists) {
                await userRef.set({
                    uid: user.uid,
                    display_name: user.email.split('@')[0],
                    email: user.email
                });
            }
        }

        // ============================================
        // ৩. চ্যাট লিস্ট লোড করা (ইনবক্স)
        // ============================================
        function loadChatList() {
            db.collection('chats')
              .where('participants', 'array-contains', currentUser.uid)
              .orderBy('updated_at', 'desc')
              .onSnapshot(snapshot => {
                  chatList.innerHTML = '';
                  if (snapshot.empty) {
                      chatList.innerHTML = '<p class="text-center text-gray-400 mt-10">কোনো চ্যাট নেই। নতুন চ্যাট শুরু করুন!</p>';
                      return;
                  }
                  snapshot.forEach(doc => {
                      const chat = doc.data();
                      const chatId = doc.id;
                      // বন্ধুর নাম বের করা (যে ইউজার আমি না)
                      const partnerId = chat.participants.find(id => id !== currentUser.uid);
                      
                      const chatDiv = document.createElement('div');
                      chatDiv.className = "flex items-center gap-3 p-4 bg-white border-b hover:bg-gray-50 cursor-pointer transition";
                      chatDiv.innerHTML = `
                          <div class="w-12 h-12 bg-blue-200 text-blue-700 rounded-full flex items-center justify-center font-bold text-lg">${chat.partner_name ? chat.partner_name[0].toUpperCase() : '?'}</div>
                          <div class="flex-1">
                              <h3 class="font-bold text-gray-800">${chat.partner_name || 'Unknown'}</h3>
                              <p class="text-sm text-gray-500 truncate">${chat.last_message || 'নতুন চ্যাট'}</p>
                          </div>
                          <div class="text-xs text-gray-400">${chat.updated_at ? chat.updated_at.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</div>
                      `;
                      chatDiv.onclick = () => openChat(chatId, partnerId, chat.partner_name);
                      chatList.appendChild(chatDiv);
                  });
              });
        }

        // ============================================
        // ৪. নতুন চ্যাট শুরু করা (বন্ধু অ্যাড)
        // ============================================
        newChatBtn.addEventListener('click', async () => {
            const friendEmail = prompt("বন্ধুর ইমেইল দিন:").trim().toLowerCase();
            if (!friendEmail) return;
            if (friendEmail === currentUser.email) return alert("নিজের সাথে চ্যাট করা যাবে না!");

            // ইমেইল দিয়ে বন্ধুকে খোঁজা
            const usersRef = db.collection('users');
            const snapshot = await usersRef.where('email', '==', friendEmail).get();

            if (snapshot.empty) return alert("এই ইমেইলে কোনো ইউজার পাওয়া যায়নি!");
            
            const friendDoc = snapshot.docs[0];
            const friendData = friendDoc.data();
            const friendId = friendData.uid;

            // চেক করা আগে থেকেই চ্যাট আছে কি না
            const existingChat = await db.collection('chats')
                .where('participants', 'array-contains', currentUser.uid)
                .get();
            
            let chatExists = false;
            let existingChatId = null;
            existingChat.forEach(doc => {
                const p = doc.data().participants;
                if (p.includes(friendId)) {
                    chatExists = true;
                    existingChatId = doc.id;
                }
            });

            if (chatExists) {
                openChat(existingChatId, friendId, friendData.display_name);
            } else {
                // নতুন চ্যাট তৈরি করা
                const newChatRef = await db.collection('chats').add({
                    participants: [currentUser.uid, friendId],
                    partner_name: friendData.display_name, // সহজে দেখানোর জন্য
                    last_message: '',
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                openChat(newChatRef.id, friendId, friendData.display_name);
            }
        });

        // ============================================
        // ৫. চ্যাট রুম খোলা ও মেসেজ লোড করা
        // ============================================
        function openChat(chatId, partnerId, partnerName) {
            activeChatId = chatId;
            activeChatPartner = { id: partnerId, name: partnerName };
            
            inboxScreen.classList.add('hidden');
            chatRoomScreen.classList.remove('hidden');
            chatPartnerName.innerText = partnerName;
            chatPartnerAvatar.innerText = partnerName ? partnerName[0].toUpperCase() : '?';
            
            loadMessages(chatId);
        }

        backToInboxBtn.addEventListener('click', () => {
            if (unsubscribeMessages) unsubscribeMessages(); // লিসেনার বন্ধ করা
            chatRoomScreen.classList.add('hidden');
            inboxScreen.classList.remove('hidden');
            activeChatId = null;
            activeChatPartner = null;
        });

        function loadMessages(chatId) {
            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = db.collection('chats').doc(chatId).collection('messages')
              .orderBy('timestamp', 'asc')
              .limit(100)
              .onSnapshot(snapshot => {
                  messagesContainer.innerHTML = '';
                  snapshot.forEach(doc => {
                      const msg = doc.data();
                      const isMe = msg.senderId === currentUser.uid;
                      let timeString = '';
                      if (msg.timestamp) {
                          timeString = msg.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                      }
                      const msgDiv = document.createElement('div');
                      msgDiv.className = `flex gap-2 max-w-[85%] ${isMe ? 'self-end flex-row-reverse' : 'self-start'}`;
                      
                      const avatar = document.createElement('div');
                      avatar.className = "w-8 h-8 rounded-full bg-blue-200 text-blue-700 flex items-center justify-center font-bold text-xs mt-1";
                      avatar.innerText = (msg.senderName || 'U')[0].toUpperCase();

                      const bubble = document.createElement('div');
                      bubble.className = `p-3 rounded-2xl shadow-sm text-sm relative ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 rounded-bl-none border border-gray-100'}`;
                      bubble.innerHTML = `
                          ${!isMe ? `<div class="text-xs font-bold text-blue-600 mb-1">${msg.senderName}</div>` : ''}
                          <div class="leading-relaxed">${msg.text}</div>
                          <div class="text-[10px] text-right mt-1 ${isMe ? 'text-blue-200' : 'text-gray-400'}">${timeString}</div>
                      `;
                      msgDiv.appendChild(avatar);
                      msgDiv.appendChild(bubble);
                      messagesContainer.appendChild(msgDiv);
                  });
                  messagesContainer.scrollTop = messagesContainer.scrollHeight;
              });
        }

        // ============================================
        // ৬. মেসেজ পাঠানো
        // ============================================
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || !activeChatId) return;
            
            try {
                // চ্যাটের ভেতরে মেসেজ যোগ করা
                await db.collection('chats').doc(activeChatId).collection('messages').add({
                    text: text,
                    senderId: currentUser.uid,
                    senderName: currentUser.email.split('@')[0],
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // চ্যাট লিস্টে সর্বশেষ মেসেজ আপডেট করা
                await db.collection('chats').doc(activeChatId).update({
                    last_message: text,
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                messageInput.value = '';
            } catch (error) { alert("মেসেজ পাঠাতে সমস্যা: " + error.message); }
        }
    </script>
</body>
</html>
